plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.19.0'
}

group = 'com.bidder'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

spotless {
	java {
		target 'src/**/*.java'
		importOrder('java', 'javax', 'com.acme', '', '\\#com.acme', '\\#')
		removeUnusedImports()
		eclipse()   // eclipse, prettier, googleJavaFormat
		formatAnnotations()
		licenseHeader '/* (C) $YEAR \nbidder.app */'
	}
}

repositories {
	mavenCentral()
	mavenLocal()
	def ghPackageRepos = [
			'https://maven.pkg.github.com/ammad-qureshi-dev/bidder-notification-service',
			'https://maven.pkg.github.com/ammad-qureshi-dev/catalog-model-service',
			'https://maven.pkg.github.com/ammad-qureshi-dev/bidder-identity-and-auth-service'
	]

	ghPackageRepos.each { repoUrl ->
		maven {
			url = uri(repoUrl)
			credentials {
				username = System.getenv('BIDDER_USERNAME')
				password = System.getenv('BIDDER_GITHUB_TOKEN')
			}
		}
	}
}

dependencies {
	implementation project(':bidding-model')

	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-freemarker'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-quartz'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-freemarker-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-mail-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-quartz-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	implementation 'com.bidder:notifications-model:2.1.1'
	implementation 'com.bidder:common-model:0.0.3-SNAPSHOT'
	implementation 'com.bidder:catalog-service-model:0.0.5'

//	ToDo: check if we can remove this since there are not many auth-related items in this repo
	implementation 'com.bidder:identity-auth-service:0.0.3'
}

tasks.named('test') {
	useJUnitPlatform()
}
